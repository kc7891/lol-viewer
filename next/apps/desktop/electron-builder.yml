appId: io.github.kc7891.lolviewer.next
productName: LoL Viewer Next
executableName: lol-viewer-next
# The workspace package is "@lol-viewer/desktop"; without this the install
# folder and userData folder become "@lol-viewerdesktop".
extraMetadata:
  name: lol-viewer-next
directories:
  output: release
files:
  - out/**
  - assets/**
  - package.json
asar: true
# koffi (a runtime dependency, so electron-builder packs it) loads a native .node file (the per-OS binary lives in @koromix/koffi-*): keep both outside the asar.
asarUnpack:
  - "**/node_modules/koffi/**"
  - "**/node_modules/@koromix/**"
win:
  icon: assets/app_icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  # One-click, per-user install into %LOCALAPPDATA%\Programs\lol-viewer-next.
  # No admin rights and no folder choice: the previous assisted installer let a
  # non-elevated (per-user) install target protected folders such as
  # "D:\Program Files", where every file write failed mid-install.
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  # Display name of the shortcuts only. productName / install folder / appId stay
  # as they are: the Windows CI install tests address them by path.
  shortcutName: LoL Viewer
  artifactName: lol-viewer-next-setup-${version}.exe
linux:
  target: [dir]
# Generic provider: electron-builder writes latest.yml next to the installer and embeds this feed in
# app-update.yml. The release workflow uploads both to the fixed "app-latest" release (design §6).
# The build version comes from the CLI (-c.extraMetadata.version=X.Y.Z); package.json's is a dev default.
publish:
  provider: generic
  url: https://github.com/kc7891/lol-viewer/releases/download/app-latest/

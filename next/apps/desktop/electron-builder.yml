appId: io.github.kc7891.lolviewer.next
productName: LoL Viewer Next
executableName: lol-viewer-next
# The workspace package is "@lol-viewer/desktop"; without this the install
# folder and userData folder become "@lol-viewerdesktop".
extraMetadata:
  name: lol-viewer-next
directories:
  output: release
files:
  - out/**
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  # Assisted, per-machine installer: UAC prompt, and the install folder can be
  # chosen (default: C:\Program Files\LoL Viewer Next). Per-machine is what
  # makes any folder writable. The earlier assisted installer was per-user, so
  # a non-elevated install into "D:\Program Files" failed mid-install.
  oneClick: false
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: true
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  artifactName: lol-viewer-next-setup-${version}.exe
linux:
  target: [dir]
publish: null

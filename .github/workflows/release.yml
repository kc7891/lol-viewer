name: Automatic Release

# Why this workflow still exists (and why its filename must NOT change):
#
# LoL Viewer v0.34.0 was the final release of the old Python app. Old installs update themselves by
# downloading the migration bootstrapper from
#   https://nightly.link/kc7891/lol-viewer/workflows/release/main/lol-viewer-setup.zip
# which serves the `lol-viewer-setup` artifact of the latest successful run of THIS file
# (.github/workflows/release.yml) on main. That URL is baked into every installed old app.
#
# The bootstrapper (migrate-to-next.iss) installs LoL Viewer Next and removes the old app. It bundles the
# newest Next installer, and artifacts expire after 90 days, so a monthly run refreshes it.
#
# This workflow no longer creates tags, releases or version bumps.

on:
  schedule:
    # Monthly refresh: keeps the artifact inside its 90-day retention and bundles the newest Next installer.
    - cron: '17 3 1 * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - migrate-to-next.iss
      - .github/workflows/release.yml

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the latest LoL Viewer Next installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download app-latest --repo "$env:GITHUB_REPOSITORY" --pattern 'lol-viewer-next-setup-*.exe' --dir next-installer
          if ($LASTEXITCODE -ne 0) { Write-Error "gh release download failed"; exit 1 }
          $files = @(Get-ChildItem next-installer -Filter 'lol-viewer-next-setup-*.exe')
          if ($files.Count -ne 1) {
            Write-Error "Expected exactly one installer, found $($files.Count)"
            exit 1
          }
          Write-Host "Bundling $($files[0].Name)"
          Rename-Item -Path $files[0].FullName -NewName 'lol-viewer-next-setup.exe'
        shell: pwsh

      - name: Build Installer
        uses: Minionguyjpro/inno-setup-action@36e43b836ce2c78d21787b1f7183caf85c60ba05 # v1.3.0
        with:
          path: migrate-to-next.iss

      # nightly.link serves the newest successful run's artifact named lol-viewer-setup.
      - name: Upload as Artifact for nightly.link
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lol-viewer-setup
          path: installer_output/lol-viewer-setup.exe
          retention-days: 90

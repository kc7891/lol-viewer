name: Windows Build

# Pull-request check for the migration bootstrapper (migrate-to-next.iss): compile it, then run it on
# a Windows runner on top of the last released old app and verify Next is installed and the old app is gone.

on:
  pull_request:
    branches: [ main ]
    paths:
      - migrate-to-next.iss
      - .github/workflows/release.yml
      - .github/workflows/windows-build.yml
  push:
    branches: [ main ]
    paths:
      - migrate-to-next.iss
      - .github/workflows/release.yml
      - .github/workflows/windows-build.yml

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Download the latest LoL Viewer Next installer
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release download app-latest --repo "$env:GITHUB_REPOSITORY" --pattern 'lol-viewer-next-setup-*.exe' --dir next-installer
        if ($LASTEXITCODE -ne 0) { Write-Error "gh release download failed"; exit 1 }
        $files = @(Get-ChildItem next-installer -Filter 'lol-viewer-next-setup-*.exe')
        if ($files.Count -ne 1) {
          Write-Error "Expected exactly one installer, found $($files.Count)"
          exit 1
        }
        Rename-Item -Path $files[0].FullName -NewName 'lol-viewer-next-setup.exe'
      shell: pwsh

    - name: Build Installer
      uses: Minionguyjpro/inno-setup-action@36e43b836ce2c78d21787b1f7183caf85c60ba05 # v1.3.0
      with:
        path: migrate-to-next.iss

    # Install the last released old app so the migration has something to remove.
    - name: Install the previous old release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # Pinned: v0.33.6 is the last release that ships the old app. Every later v* release ships the bootstrapper.
        $tag = 'v0.33.6'
        Write-Host "Previous old release: $tag"
        gh release download $tag --repo "$env:GITHUB_REPOSITORY" --pattern 'lol-viewer-setup.zip' --dir old-release
        if ($LASTEXITCODE -ne 0) { Write-Error "gh release download failed"; exit 1 }
        Expand-Archive old-release\lol-viewer-setup.zip -DestinationPath old-release
        # Not Start-Process -Wait: it waits for the whole process tree, and the old installer launches the old app
        # even when silent, so it would never return. WaitForExit waits for the installer process only.
        $p = Start-Process -FilePath old-release\lol-viewer-setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru
        $p.WaitForExit()
        if ($p.ExitCode -ne 0) { Write-Error "Old installer exited with $($p.ExitCode)"; exit 1 }
        # The old updater exits before it runs the bootstrapper; do the same here.
        Start-Sleep -Seconds 5
        Get-Process -Name 'lol-viewer' -ErrorAction SilentlyContinue | Stop-Process -Force
        $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{8F7A2B3C-4D5E-6F7A-8B9C-0D1E2F3A4B5C}_is1'
        if (-not (Test-Path $key)) { Write-Error "Old app was not installed"; exit 1 }
      shell: pwsh

    - name: Smoke test the migration
      run: |
        $p = Start-Process -FilePath installer_output\lol-viewer-setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru
        $p.WaitForExit()
        Write-Host "Bootstrapper exit code: $($p.ExitCode)"
        if ($p.ExitCode -ne 0) { Write-Error "Bootstrapper failed"; exit 1 }

        $exe = Join-Path $env:LOCALAPPDATA 'Programs\lol-viewer-next\lol-viewer-next.exe'
        if (-not (Test-Path $exe)) { Write-Error "LoL Viewer Next was not installed: $exe"; exit 1 }

        $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{8F7A2B3C-4D5E-6F7A-8B9C-0D1E2F3A4B5C}_is1'
        # The Inno uninstaller re-launches itself from a temp copy, so removal can finish after the bootstrapper exits.
        for ($i = 0; $i -lt 60 -and (Test-Path $key); $i++) { Start-Sleep -Seconds 1 }
        if (Test-Path $key) { Write-Error "Old app is still installed"; exit 1 }
        Write-Host "Migration OK"

        # The installer launches Next after install; stop it.
        Get-Process -Name 'lol-viewer-next' -ErrorAction SilentlyContinue | Stop-Process -Force
      shell: pwsh

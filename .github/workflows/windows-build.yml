name: Windows Build

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write  # Required for uploading to releases

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --require-hashes -r requirements.txt

    - name: Fetch champion data
      run: |
        python scripts/fetch_champions.py
        echo "Champion data generated:"
        python -c "import json; data = json.load(open('champions.json', 'r', encoding='utf-8')); print(f'{len(data)} champions loaded')"

    - name: Verify build prerequisites
      run: |
        python scripts/check_build.py

    - name: Build Release Version
      run: |
        pyinstaller lol-viewer.spec

    - name: Update Installer Version
      run: |
        $version = python -c "from constants import __version__; print(__version__)"
        $issContent = Get-Content lol-viewer.iss -Raw
        $issContent = $issContent -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$version`""
        Set-Content lol-viewer.iss -Value $issContent
        Write-Host "Updated installer version to: $version"
      shell: pwsh

    - name: Build Installer
      uses: Minionguyjpro/inno-setup-action@ec985ef724d1fb4a05bfbc1a8e49930dc76d2b0c # v1.2.9
      with:
        path: lol-viewer.iss

    - name: Package Installer as Zip
      run: |
        cd installer_output
        Compress-Archive -Path lol-viewer-setup.exe -DestinationPath lol-viewer-setup.zip
      shell: pwsh

    - name: Upload Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: lol-viewer-setup
        path: installer_output/lol-viewer-setup.zip
        retention-days: 90

    - name: Build Summary
      run: |
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "✓ Test build completed"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo ""
        echo "Branch: ${{ github.ref_name }}"
        echo "Package: lol-viewer-setup.zip (test build)"
        echo ""
        echo "The installer artifact is available for download in the Actions tab."
        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      shell: bash

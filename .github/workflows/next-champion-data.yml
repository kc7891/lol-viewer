name: Next champion data

# Regenerates next/packages/core/data/champions.json (ids, names, URL slugs,
# per-rank spell cooldowns) from Data Dragon and opens a PR when a new patch
# changed anything. The PR body lists every cooldown change for review.
# Only next/ is touched, so merging it never triggers a Python release.

on:
  schedule:
    # Thursdays 10:23 UTC (19:23 JST): patches usually ship on Wednesday.
    - cron: "23 10 * * 4"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: next
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: next/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: next/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Regenerate from Data Dragon
        run: pnpm champion-data --summary "$RUNNER_TEMP/champion-data-summary.md"

      - name: Validate (schema, roster, scenario coverage)
        run: pnpm test

      - name: Read patch
        id: patch
        run: echo "version=$(node -p "require('./packages/core/data/champions.json').patch")" >> "$GITHUB_OUTPUT"

      - name: Open PR if anything changed
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          add-paths: |
            next/packages/core/data/champions.json
            next/packages/core/data/items.json
          branch: automated/next-champion-data
          delete-branch: true
          commit-message: "chore(next): update champion data to Data Dragon ${{ steps.patch.outputs.version }}"
          title: "chore(next): update champion data to Data Dragon ${{ steps.patch.outputs.version }}"
          body-path: ${{ runner.temp }}/champion-data-summary.md

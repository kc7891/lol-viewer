name: Next (Electron PoC)

# CI for the next/ PoC only. The Python app's workflows ignore next/** and this
# one only runs for next/** changes, so the two never block or release each other.
# This workflow never publishes anything: no releases, no tags, read-only token.

on:
  push:
    paths:
      - "next/**"
      - ".github/workflows/next-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "next/**"
      - ".github/workflows/next-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: next-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: next

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: next/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: next/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit + integration tests (core, fake LCU -> connector -> hub)
        run: pnpm test

      - name: Build web + Storybook
        run: pnpm web:build && pnpm storybook:build

      - name: Install Playwright Chromium + screen grabber
        run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends imagemagick xvfb

      - name: Storybook screenshots
        run: pnpm e2e:storybook

      - name: Electron E2E (fake LCU, native external views)
        run: |
          pnpm desktop:build
          xvfb-run -a -s "-screen 0 1600x900x24" pnpm e2e:electron

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: next-screenshots-linux
          path: |
            next/e2e/screenshots/
            next/test-results/
          if-no-files-found: ignore

      - name: Upload Storybook (static, for review)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: next-storybook
          path: next/apps/web/storybook-static/

  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: next/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: next/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Build installer (unsigned)
        run: pnpm desktop:dist --win --publish never

      # Exercise the installer itself the way users do (not just win-unpacked/).
      - name: Install with the setup exe (silent, per-user)
        shell: pwsh
        run: |
          $setup = (Get-ChildItem apps/desktop/release/lol-viewer-next-setup-*.exe | Select-Object -First 1).FullName
          $p = Start-Process $setup -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\lol-viewer-next\lol-viewer-next.exe'
          if (-not (Test-Path $exe)) {
            Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Depth 1 | Out-Host
            throw "app not found at $exe"
          }
          "LOL_VIEWER_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: E2E against the installed app (fake LCU, native external views)
        run: pnpm e2e:electron

      - name: Reinstall while the app is running (update path)
        shell: pwsh
        run: |
          $app = Start-Process $env:LOL_VIEWER_EXE -PassThru
          Start-Sleep -Seconds 8
          $setup = (Get-ChildItem apps/desktop/release/lol-viewer-next-setup-*.exe | Select-Object -First 1).FullName
          $p = Start-Process $setup -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "reinstall exited with $($p.ExitCode)" }
          if (-not (Test-Path $env:LOL_VIEWER_EXE)) { throw "app missing after reinstall" }
          Get-Process lol-viewer-next -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Uninstall (silent) removes the app
        shell: pwsh
        run: |
          $dir = Split-Path $env:LOL_VIEWER_EXE
          $un = (Get-ChildItem (Join-Path $dir 'Uninstall*.exe') | Select-Object -First 1).FullName
          $p = Start-Process $un -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstaller exited with $($p.ExitCode)" }
          for ($i = 0; $i -lt 20 -and (Test-Path $env:LOL_VIEWER_EXE); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $env:LOL_VIEWER_EXE) { throw "app still present after uninstall" }

      # The runner account is an administrator; real users usually are not, and
      # many have non-ASCII profile paths. Repeat install/launch/uninstall as a
      # fresh standard user with a Japanese name.
      - name: Install, launch and uninstall as a standard (non-admin) user with a Japanese name
        shell: pwsh
        run: |
          $name = 'テスト利用者'
          $plain = 'Lv!' + [guid]::NewGuid().ToString('N').Substring(0, 16)
          $pw = ConvertTo-SecureString $plain -AsPlainText -Force
          New-LocalUser -Name $name -Password $pw -PasswordNeverExpires | Out-Null
          Add-LocalGroupMember -Group 'Users' -Member $name
          if ((Get-LocalGroupMember -Group 'Administrators').Name -match [regex]::Escape($name)) { throw "test user must not be an admin" }
          $cred = New-Object System.Management.Automation.PSCredential(".\$name", $pw)

          # The checkout folder may not be readable by other users; stage the setup in a shared folder.
          $setup = (Get-ChildItem apps/desktop/release/lol-viewer-next-setup-*.exe | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Force C:\Users\Public\lv-setup | Out-Null
          Copy-Item $setup C:\Users\Public\lv-setup\setup.exe
          $p = Start-Process C:\Users\Public\lv-setup\setup.exe -ArgumentList '/S' -Credential $cred -LoadUserProfile -WorkingDirectory C:\Users\Public\lv-setup -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer (standard user) exited with $($p.ExitCode)" }

          $profileDir = (Get-CimInstance Win32_UserProfile | Where-Object { $_.LocalPath -like "*\$name*" } | Select-Object -First 1).LocalPath
          if (-not $profileDir) { throw "profile for $name not found" }
          $exe = Join-Path $profileDir 'AppData\Local\Programs\lol-viewer-next\lol-viewer-next.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "app not installed for standard user at $exe" }
          Write-Host "installed for standard user at $exe"

          # Launch as that user and make sure it stays up.
          $app = Start-Process -FilePath $exe -Credential $cred -LoadUserProfile -WorkingDirectory (Split-Path $exe) -PassThru
          Start-Sleep -Seconds 10
          $alive = Get-Process -Id $app.Id -ErrorAction SilentlyContinue
          if (-not $alive) { throw "app exited right after launch as standard user (exit code $($app.ExitCode))" }
          Get-Process lol-viewer-next -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2

          $un = (Get-ChildItem -LiteralPath (Split-Path $exe) -Filter 'Uninstall*.exe' | Select-Object -First 1).FullName
          $p = Start-Process -FilePath $un -ArgumentList '/S' -Credential $cred -LoadUserProfile -WorkingDirectory C:\Users\Public\lv-setup -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstaller (standard user) exited with $($p.ExitCode)" }
          for ($i = 0; $i -lt 20 -and (Test-Path -LiteralPath $exe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path -LiteralPath $exe) { throw "app still present after uninstall (standard user)" }

      - name: Upload installer + screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: next-windows
          path: |
            next/apps/desktop/release/*.exe
            next/e2e/screenshots/
            next/test-results/
          if-no-files-found: ignore

name: Next (Electron PoC)

# CI for the next/ PoC only. The Python app's workflows ignore next/** and this
# one only runs for next/** changes, so the two never block or release each other.
# This workflow never publishes anything: no releases, no tags, read-only token.

on:
  push:
    paths:
      - "next/**"
      - ".github/workflows/next-ci.yml"
      - ".github/workflows/next-windows.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "next/**"
      - ".github/workflows/next-ci.yml"
      - ".github/workflows/next-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: next-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: next

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: next/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: next/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit + integration tests (core, fake LCU -> connector -> hub)
        run: pnpm test

      - name: Build web + Storybook
        run: pnpm web:build && pnpm storybook:build

      - name: Install Playwright Chromium + screen grabber
        run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends imagemagick xvfb

      - name: Storybook screenshots
        run: pnpm e2e:storybook

      - name: Electron E2E (fake LCU, native external views)
        run: |
          pnpm desktop:build
          xvfb-run -a -s "-screen 0 1600x900x24" pnpm e2e:electron

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: next-screenshots-linux
          path: |
            next/e2e/screenshots/
            next/test-results/
          if-no-files-found: ignore

      - name: Upload Storybook (static, for review)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: next-storybook
          path: next/apps/web/storybook-static/

  # Installer build and every install / update check live in next-windows.yml, shared with next-release.yml.
  windows:
    uses: ./.github/workflows/next-windows.yml
    permissions:
      contents: read

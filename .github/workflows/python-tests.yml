name: Python Tests

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  # Weekly run so newly published advisories are caught even in weeks with no
  # commits -- the audit step below is only useful if it runs on a clock.
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # Qt (PyQt6) runtime deps for headless testing
          sudo apt-get install -y xvfb libegl1 libgl1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          QT_OPENGL: software
          QTWEBENGINE_DISABLE_SANDBOX: "1"
          QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu"
          LOL_VIEWER_DISABLE_WEBENGINE: "1"
          LOL_VIEWER_DISABLE_LCU_SERVICE: "1"
          LOL_VIEWER_DISABLE_DIALOGS: "1"
        run: |
          xvfb-run -a pytest -q

  # Separate job on purpose: the audit must still report when the test job is
  # red, and it needs neither Qt system libraries nor xvfb.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install pip-audit
        run: pip install --require-hashes -r requirements-ci.txt

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit --disable-pip -r requirements.txt -r requirements-ci.txt

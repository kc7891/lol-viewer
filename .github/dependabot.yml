# Automated dependency update PRs.
#
# Security alerts from the GitHub Advisory Database are raised independently of
# this file; it controls the scheduled *version* update PRs.
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(actions)"
    groups:
      actions:
        patterns:
          - "*"

  # The new app (next/, pnpm workspace). Security updates only:
  # routine version movement is done by hand with the full next/ check suite
  # (typecheck, unit, Storybook and Electron E2E, Windows install test).
  - package-ecosystem: "npm"
    directory: "/next"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
